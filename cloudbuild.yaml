# Define the list of build steps to execute sequentially in Cloud Build
steps:
  # STEP 1: Run the linter and record its result without failing the build step
  - name: "python" # Use the official Python Docker image as the environment
    id: "lint_test" # Unique identifier for this build step
    entrypoint: "bash" # Override the image's default command to execute a Bash shell
    args:
      - "-c" # Pass the following multi-line string as a command to Bash
      - | # Block scalar indicator: allows multi-line Bash scripting
        # Install the HTML formatter plugin for flake8 and run flake8 linter.
        # Output reports to 'flake_reports/'. If flake8 fails (non-zero exit code),
        # the '||' operator catches the error and saves $? (exit code) into lint_status.
        # $? : special variable in Bash that stores the exit status (return code) of the most recently executed command
        # Every command in Linux/Bash returns an integer between 0 and 255 when it finishes. 0: Success (no errors). ; 1 or higher : Failure (an error occurred)
        pip install flake8-html \
        && flake8 --format=html --htmldir=flake_reports/ || lint_status=$?

        # Write the exit status to 'lint_exit_code.txt'.
        # $${...} escapes $ for Cloud Build so Bash evaluates it
        # ${lint_status:-0} outputs the value of lint_status, or defaults to 0 if empty (success)
        # We could have used $lint_status with no escaping needed, the above was just because we had to pass a default value of 0
        echo "$${lint_status:-0}" > lint_exit_code.txt
        echo "lint test exited with code $${lint_status:-0}"
    allowFailure: true    # Instruct Cloud Build to proceed to step 2 even if this step encounters errors
    
  # STEP 2: Evaluate the linter result and conditionally upload reports to Google Cloud Storage
  - name: 'gcr.io/cloud-builders/gsutil' # Use the official Google Cloud SDK image containing the gsutil tool
    id: "upload-lint-artifacts" # Unique identifier for this step
    entrypoint: "bash" # Override entrypoint to use Bash for conditional logic execution
    args:
      - "-c"
      - |
        # Read the stored exit code from the file created in Step 1 into a Bash variable
        lint_status=$(cat lint_exit_code.txt)
        # Check if lint_status is NOT equal to 0 (indicating linting errors occurred)
        if [ "$lint_status" -ne 0 ]; then
          echo "Lint failed (code: $lint_status). Uploading artifacts..."
          # Recursively copy all generated HTML lint reports to the designated GCS bucket
          gsutil cp -r flake_reports/* gs://emp-portal-artifact/
          echo "Exiting with error..."
          # Explicitly terminate this step with exit code 1 to intentionally fail the overall pipeline
          exit 1
        else
          echo "Lint succeeded."
        fi # End of the 'if' conditional block
    waitFor: ["lint_test"] # Explicitly ensure this step executes only after 'lint_test' completes

  - name: "python"
    id: "pytest"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install pytest-html \
        && pip install -r requirements.txt --user \
        && pytest --html=pytest_reports/pytest-report.html --self-contained-html || pytest_status=$?
        echo "$${pytest_status:-0}" > pytest_exit_code.txt
        echo "pytest exited with code $${pytest_status:-0}"   
    allowFailure: true
    waitFor: ["-"]

  - name: 'gcr.io/cloud-builders/gsutil'
    id: "upload-pytest-artifacts"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pytest_status=$(cat pytest_exit_code.txt)
        if [ "$pytest_status" -ne 0 ]; then
          echo "Pytest failed (code: $pytest_status). Uploading artifacts..."
          gsutil cp -r pytest_reports/* gs://emp-portal-artifact/
          echo "Exiting with error..."
          exit 1
        else
          echo "Pytest succeeded."
        fi
    waitFor: ["pytest"]   

  - name: "gcr.io/cloud-builders/docker"  
    id: "build"
    args: ['build', '-t', '${_IMAGE_PATH}', '.' ]

  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args: ['push', '${_IMAGE_PATH}']
    waitFor: ["build"]  

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy_feature"
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "$BRANCH_NAME" =~ ^feature-.*$ ]]
        then
          gcloud run deploy "${BRANCH_NAME}" --image  "${_IMAGE_PATH}" --region "${_DEPLOY_REGION}" --allow-unauthenticated
        fi

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "test_feature"
    entrypoint: bash
    args:
      - -c
      - | 
        if [[ "$BRANCH_NAME" =~ ^feature-.*$ ]]
        then
          gcloud run services describe "${BRANCH_NAME}" --region "${_DEPLOY_REGION}" --format='value(status.url)' | xargs -I {} curl -s "{}" | grep "Support Tickets" && echo "Test passed" || (echo "Test failed" && exit 1)
        fi

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "register_pipeline"
    
    entrypoint: bash
    args:
      - -c
      - | 
        if [[ "$BRANCH_NAME" == "main" ]]
        then
          gcloud deploy apply --file=./deploy/clouddeploy.yaml --region=$_DEPLOY_REGION --project=$PROJECT_ID
        fi  

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create_release'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "main" ]]
        then
          gcloud deploy releases create emp-portal-$SHORT_SHA --delivery-pipeline emp-portal-pipeline --region $_DEPLOY_REGION --images app-image="$_IMAGE_PATH"
        fi

substitutions:
  _LOCATION: asia-south1-docker.pkg.dev
  _IMAGE: emp-portal-repo/emp-portal-image
  _IMAGE_PATH: ${_LOCATION}/${PROJECT_ID}/${_IMAGE}:${BRANCH_NAME}  
  _DEPLOY_REGION: us-central1

options:
  dynamicSubstitutions: true    
